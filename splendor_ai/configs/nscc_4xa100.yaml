# Production layout for one NSCC `ai`-queue node: 4x A100-40GB + 64 CPU cores
# (docs/AI_DESIGN.md §0/§1.8, docs/research/judges.md "training_plan_4xA100").
#
#   GPU 0     learner, bf16 autocast, single rank.  DDP is NOT wired (the
#             orchestrator is single-rank; see learner.DDP_NOT_WIRED) and the
#             learner refuses to start with WORLD_SIZE > 1.  A ~12.6M-parameter
#             MLP is >15x oversupplied by one A100, so this is not a loss.
#   GPU 1-3   three inference servers, batch <= 1024, coalescing window 1 ms
#   CPU       56 actor processes x 24 concurrent games = 1,344 games in flight,
#             leaving ~8 cores for the learner, the servers and the OS
#
# Every number here is overridable, e.g.
#   --set selfplay.actors=48 --set search_full.sims=800 --set learner.batch=8192
run_dir: runs/nscc0
seed: 20260902

net:
  width: 768
  blocks: 10                 # ~12.6M parameters

search_full:                 # 25% of moves, recorded
  sims: 600
  universes: 6
  noise: true
  dirichlet_alpha_scale: 10.0
  noise_eps: 0.25
  forced_playouts_k: 2.0
  prune_policy_target: true
  c_puct: 1.5
  fpu_reduction: 0.25
  root: puct                 # 'gumbel' is the documented A/B (§4)
  gumbel_m: 16
  deck_reserve_penalty: [0.02, 0.06, 0.12]
  max_depth: 200

search_fast:                 # 75% of moves, not recorded
  sims: 120
  universes: 6
  noise: false
  forced_playouts_k: 0.0
  prune_policy_target: false
  c_puct: 1.5
  max_depth: 200

selfplay:
  actors: 56
  games_per_actor: 24
  pcr_full_prob: 0.25
  temperature_plies: 12
  temperature: 1.0
  max_plies: 400
  truncation_z_weight: 0.3
  win_threshold: null        # the real rules; NEVER override for a real run
  augment_rotations: 5
  mixed_game_frac: 0.25
  opponent_weights: {latest: 0.0, historical: 0.6, anchor: 0.4}
  historical_pool_size: 16      # also the checkpoint retention floor
  historical_cache: 3           # LRU of loaded historical nets, per actor
  historical_pool_refresh_s: 60.0   # cache the pool listing this long
  historical_reuse_prob: 0.85   # reuse an already-loaded opponent this often
  stats_every_s: 30.0
  weight_refresh_s: 60.0
  progress_refresh_s: 30.0      # re-read progress.json (curriculum) this often
  ship_every_games: 4
  # A wave is `games_per_actor` searches deep; the stop grace has to outlive
  # one wave or `timeout --signal=INT` costs the run its last games.
  stop_grace_s: 60.0
  restart_budget: 8             # per actor, inside restart_window_s
  restart_window_s: 900.0
  restart_backoff_s: 2.0
  restart_backoff_max_s: 120.0
  # Curriculum (§1.8): 2p-only at reduced search for the first 300k games,
  # then the five-mode mixture.
  mode_mixture: {ind2: 0.25, ind3: 0.15, ind4: 0.15, ovt: 0.20, team_adj: 0.15, team_opp: 0.10}
  phases:
    - until_games: 50000     # h0-h1 warm-up: cheap search, 2p only
      mixture: {ind2: 1.0}
      sims_full: 150
      sims_fast: 40
    - until_games: 300000    # full budgets, still 2p only
      mixture: {ind2: 1.0}
    - until_games: 1000000   # ramp to the mixture
      mixture: {ind2: 0.40, ind3: 0.15, ind4: 0.15, ovt: 0.15, team_adj: 0.10, team_opp: 0.05}
    - until_games: null      # steady state
      mixture: {ind2: 0.25, ind3: 0.15, ind4: 0.15, ovt: 0.20, team_adj: 0.15, team_opp: 0.10}

replay:
  window_start: 4
  window_end: 20
  window_ramp_generations: 40
  # RAM cap, NOT the window: whichever of the two is smaller decides what the
  # learner actually samples from, so it has to be set above the window or the
  # config is lying about the window (the trainer warns once when it bites and
  # logs `window_retained` every generation).
  # The full window is 20 generations x 20,000 games x ~75 augmented records
  # per game ~= 30M records; at 414 B/record that is ~11.6 GiB.  40M gives it
  # headroom to ~15.4 GiB, on a node with 440 GB.
  max_samples: 40000000
  min_samples: 200000
  checkpoint: true
  checkpoint_async: true     # ~41 s at this size; the main loop is the learner

learner:
  algorithm: az              # switch to `ppo` for the fallback learner
  device: cuda:0
  batch: 4096
  lr: 2.0e-4
  lr_final: 2.0e-5
  warmup_steps: 2000
  cosine_steps: 400000
  weight_decay: 1.0e-4
  grad_clip: 1.0
  replay_ratio: 5.0          # judges.md: target 4-8x sample reuse
  publish_every: 200         # ~2 min at ~1.5 steps/s
  checkpoint_every_s: 600.0
  bf16: true
  value_blend: 0.5           # 0.5*root Q + 0.5*outcome (judges.md)
  log_every: 50
  prefetch: true             # prepare the next batch while this step runs
  ddp: false                 # DDP is NOT wired; WORLD_SIZE > 1 is refused
  checkpoint_retention: true # prune gen_XXXX.pt (pool + milestones), ~125 GB

inference:
  mode: server
  devices: [cuda:1, cuda:2, cuda:3]
  max_batch: 1024
  max_wait_ms: 1.0
  reload_every_s: 60.0
  queue_size: 512

eval:
  enabled: true
  every_generations: 5
  pairs: 100
  search_pairs: 25
  sims_eval: 400
  opponents: [random, greedy]
  search_bot: true
  async_process: true
  # 0 = skip the ONE final evaluation when the run was stopped by a signal.
  # The PBS chain stops a link with `timeout --signal=INT --kill-after=10m`:
  # after the SIGINT this job has minutes, and a final evaluation here is 100
  # paired games + 25 search games.  The checkpoint is what the next link
  # needs.  Set a positive budget (seconds) to run it anyway, capped.
  final_eval_seconds: 0.0

games_per_generation: 20000
# RUN-lifetime budget, restored from the checkpoint on every resume -- not a
# per-link one (each link is bounded by the PBS walltime and TRAIN_TIMEOUT in
# scripts/nscc_train.pbs).  118 h of self-play across the whole chain; raise it
# with `--set max_seconds=...` to keep a chain going past that.
max_seconds: 424800
torch_threads: 1
learner_threads: 8
