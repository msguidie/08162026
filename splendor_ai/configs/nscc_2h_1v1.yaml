# The two-hour 1v1 sprint on one 4x A100 node, measured and tuned.
#
# Launch it with scripts/train_1v1_2h.sh on an interactive node: that script
# sizes the actor pool from the cores the job really has and prints the log.
#
# Layout as in nscc_4xa100.yaml (GPU 0 learner, GPU 1-3 inference servers, the
# rest of the cores on actors).  Knobs, and the measurement behind each
# (scripts/speed_probe.py on x1000c2s5b0n0, 128 cores, 120 actors):
#
#   * games_per_actor 128.  An actor sends one batched request per lockstep
#     round, and a GPU call costs ~1.9 ms whether it carries 8 rows or 256, so
#     rows per request is the whole game: 24 games gave 120k sims/s, 64 gave
#     179k, 128 gave 204k.
#   * no historical opponents.  A historical checkpoint is evaluated on the
#     actor's own CPU, and every round of all 128 games waits for it.  In two
#     hours there is barely a pool to draw from anyway; 10% of games put the
#     greedy anchor in one seat instead, which costs nothing and keeps a
#     sanity signal in the data.
#   * 2p only, no curriculum; 256/64 sims (PCR 25%); a 512x8 net (~4.7M); a
#     3 -> 10 generation replay window, not checkpointed; 5,000-game
#     generations, so an evaluation lands every ~15 minutes.
#   * cosine_steps 24000: ~2,250 records/s x replay_ratio 6 / batch 3072 is
#     ~4.4 learner steps/s, ~26k steps in 100 minutes.  The old 12k schedule
#     would have spent the second hour at the floor learning rate.
#
# It trains ind2 ONLY.  For 1v2 / 2v2 use nscc_4xa100.yaml -- those modes need
# the full curriculum, not a sprint.
run_dir: runs/sprint2h
seed: 20260908

net:
  width: 512
  blocks: 8                  # ~5.5M parameters

search_full:                 # 25% of moves, recorded
  sims: 256
  universes: 4
  noise: true
  dirichlet_alpha_scale: 10.0
  noise_eps: 0.25
  forced_playouts_k: 1.0     # halved: 256 sims is a smaller budget to share
  prune_policy_target: true
  c_puct: 1.5
  fpu_reduction: 0.25
  root: puct
  gumbel_m: 16
  deck_reserve_penalty: [0.02, 0.06, 0.12]
  max_depth: 200

search_fast:                 # 75% of moves, not recorded
  sims: 64
  universes: 3
  noise: false
  forced_playouts_k: 0.0
  prune_policy_target: false
  c_puct: 1.5
  max_depth: 200

selfplay:
  actors: 120                # the launcher overrides this from the core count
  games_per_actor: 128
  pcr_full_prob: 0.25
  temperature_plies: 12
  temperature: 1.0
  max_plies: 400
  truncation_z_weight: 0.3
  win_threshold: null        # the real rules; NEVER override for a real run
  augment_rotations: 5
  mixed_game_frac: 0.10
  # Pure self-play plus a greedy seat in 10% of games; no historical nets (see
  # the header: they run on the actor's CPU and stall every game in its wave).
  opponent_weights: {latest: 0.0, historical: 0.0, anchor: 1.0}
  historical_pool_size: 16
  historical_cache: 3
  historical_pool_refresh_s: 60.0
  historical_reuse_prob: 0.85
  stats_every_s: 30.0
  weight_refresh_s: 30.0     # halved: weights move fast in a sprint
  progress_refresh_s: 30.0
  ship_every_games: 4
  stop_grace_s: 60.0
  restart_budget: 8
  restart_window_s: 900.0
  restart_backoff_s: 2.0
  restart_backoff_max_s: 120.0
  mode_mixture: {ind2: 1.0}
  phases:
    - until_games: null      # no curriculum: 2p at full budget from game 1
      mixture: {ind2: 1.0}

replay:
  window_start: 3
  window_end: 10
  window_ramp_generations: 20
  max_samples: 12000000      # ~5 GiB at 414 B/record
  min_samples: 60000         # first learner step after ~1 generation
  checkpoint: false          # nothing to resume in a 2h run; saves the I/O
  checkpoint_async: true

learner:
  algorithm: az
  device: cuda:0
  batch: 3072
  lr: 3.0e-4
  lr_final: 5.0e-5
  warmup_steps: 500
  cosine_steps: 24000        # ~4.4 steps/s x 100 min, see the header
  weight_decay: 1.0e-4
  grad_clip: 1.0
  replay_ratio: 6.0
  publish_every: 100         # fresh weights to the actors roughly every minute
  checkpoint_every_s: 300.0
  bf16: true
  value_blend: 0.5
  log_every: 25
  prefetch: true
  ddp: false
  checkpoint_retention: true

inference:
  mode: server
  devices: [cuda:1, cuda:2, cuda:3]
  max_batch: 1024
  max_wait_ms: 1.0
  reload_every_s: 30.0
  queue_size: 512

eval:
  enabled: true
  every_generations: 5
  pairs: 60
  search_pairs: 12
  sims_eval: 200
  opponents: [random, greedy]
  search_bot: true
  async_process: true
  # Unlike the chained production run, this one ends for good when it ends:
  # spend two minutes on a final measurement so the sprint has a verdict.
  final_eval_seconds: 120.0

games_per_generation: 5000
max_seconds: 6000            # 100 min of self-play inside a 2 h allocation
torch_threads: 1
learner_threads: 8
